# ST-04 · Create my account — end to end against a local Supabase.
# Signs up test number 0770000003 (OTP 123456, see supabase/config.toml), then creates the
# account. Keyboard: press Enter to close it (hideKeyboard presses Back, which would close
# the app on these screens).
appId: lk.fizzix.app
name: ST-04 Create my account
tags:
  - ST-04
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: language-screen
    timeout: 60000
- tapOn:
    id: language-continue

# ST-02: verify the number.
- extendedWaitUntil:
    visible:
      id: register-screen
    timeout: 20000
- tapOn:
    id: register-phone
- inputText: '0770000003'
- tapOn: 'புதிய கணக்கு'
- tapOn:
    id: register-send-otp
- extendedWaitUntil:
    visible:
      id: register-verify
    timeout: 20000
- inputText: '123456'
- tapOn: 'புதிய கணக்கு'
- tapOn:
    id: register-verify

# AC1: the account screen shows the verified number and every field.
- extendedWaitUntil:
    visible:
      id: account-screen
    timeout: 20000
- assertVisible: '.*77 000 0003.*'

# After each field, press Enter: a single-line input blurs on submit, so the keyboard closes
# and the next field is not hidden. (Tapping a label can hit the input itself, which shares
# the label as its accessibility label, and keeps the keyboard open.)
- tapOn:
    id: account-name
- inputText: 'Arjun Kumar'
- pressKey: Enter
- tapOn:
    id: account-username
- inputText: 'arjun_e2e'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: account-password
- tapOn:
    id: account-password
- inputText: 'physics26'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: account-confirm
- tapOn:
    id: account-confirm
- inputText: 'physics99'
- pressKey: Enter

# AC3: the username is checked against the server.
- extendedWaitUntil:
    visible: '.*username கிடைக்கிறது.*'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: account-year-2027
- tapOn:
    id: account-year-2027
- tapOn:
    id: account-stream-bio

# AC2: mismatched passwords are caught before anything is saved.
- scrollUntilVisible:
    element:
      id: account-submit
- tapOn:
    id: account-submit
- scrollUntilVisible:
    element:
      id: account-confirm
    direction: UP
- assertVisible: '.*பொருந்தவில்லை.*'
- tapOn:
    id: account-confirm
- eraseText: 12
- inputText: 'physics26'
- pressKey: Enter
- assertVisible: '.*பொருந்துகின்றன.*'

# AC4: the account is created and home opens, signed in.
- scrollUntilVisible:
    element:
      id: account-submit
- tapOn:
    id: account-submit
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000

# Signed in after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
