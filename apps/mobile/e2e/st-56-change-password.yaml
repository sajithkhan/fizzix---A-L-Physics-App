# ST-56 · Change my password — end to end against a local Supabase and the change-password
# Edge Function. Test number 0770000011 (OTP 123456 at sign-up only; changing the password
# needs no OTP). Keyboard: Enter closes it (hideKeyboard presses Back, which closes the app).
appId: lk.fizzix.app
name: ST-56 Change my password
tags:
  - ST-56
---
- runFlow:
    file: subflows/sign-up.yaml
    env:
      PHONE: '0770000011'
      NAME: 'Dilan Perera'
      USERNAME: 'dilan_e2e'

# AC1: Settings › "Password மாற்று" asks for the current password and the new one twice.
- tapOn:
    id: home-settings
- tapOn:
    id: settings-change-password
- extendedWaitUntil:
    visible:
      id: change-password-screen
    timeout: 20000
- assertVisible: '.*OTP தேவையில்லை.*'

# A wrong current password changes nothing.
- tapOn:
    id: change-current
- inputText: 'guess1234'
- pressKey: Enter
- tapOn:
    id: change-password
- inputText: 'newphys27'
- pressKey: Enter
- tapOn:
    id: change-confirm
- inputText: 'newphys27'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: change-save
- tapOn:
    id: change-save
- extendedWaitUntil:
    visible:
      id: change-current-status
    timeout: 20000
- assertVisible: 'இப்போதைய password தவறு.'

# AC2: the right current password, no OTP: saved, and this phone stays signed in.
- scrollUntilVisible:
    element:
      id: change-current
    direction: UP
- tapOn:
    id: change-current
- inputText: 'physics26'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: change-save
- tapOn:
    id: change-save
- extendedWaitUntil:
    visible:
      id: change-done
    timeout: 20000
- assertNotVisible:
    id: register-otp
- tapOn:
    id: change-done-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 20000

# Still signed in after a restart (the new session belongs to this phone).
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000

# Log out: the old password no longer works, the new one does.
- runFlow: subflows/log-out.yaml
- tapOn:
    id: login-phone
- inputText: '0770000011'
- pressKey: Enter
- tapOn:
    id: login-password
- inputText: 'physics26'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: login-error
    timeout: 20000
- tapOn:
    id: login-password
- inputText: 'newphys27'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000
