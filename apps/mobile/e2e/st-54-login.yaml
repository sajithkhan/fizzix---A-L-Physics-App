# ST-54 · Log in with number and password — end to end against a local Supabase and the
# login Edge Function. Creates an account for test number 0770000005 (OTP 123456, see
# supabase/config.toml), logs out, then logs in: wrong password, right password, and
# the 5-wrong-tries lock. Keyboard: Enter closes it; on the password field Enter also
# submits, like a student pressing "go" (hideKeyboard presses Back, which would close the app).
appId: lk.fizzix.app
name: ST-54 Log in with number and password
tags:
  - ST-54
---
# Set up: a finished account (ST-02, ST-04, ST-58).
- runFlow:
    file: subflows/sign-up.yaml
    env:
      PHONE: '0770000005'
      NAME: 'Kavin Raj'
      USERNAME: 'kavin_e2e'

# Log out (ST-07): the app now opens on login. AC4: login and sign-up link to each other.
- runFlow: subflows/log-out.yaml
- tapOn:
    id: login-register-link
- extendedWaitUntil:
    visible:
      id: register-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: register-login-link
- tapOn:
    id: register-login-link

# AC1: number with +94 and password with the eye button.
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 20000
- assertVisible: '\+94'
- assertVisible:
    id: login-password-toggle
- tapOn:
    id: login-phone
- inputText: '0770000005'
- pressKey: Enter

# AC2: a wrong password shows one message that names neither field.
- tapOn:
    id: login-password
- inputText: 'wrong1234'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: login-error
    timeout: 20000
- assertVisible: '.*இலக்கம் அல்லது password தவறு.*'

# AC2: the right password opens home.
- tapOn:
    id: login-password
- inputText: 'physics26'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000

# Still signed in after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000

# AC3: five wrong tries lock the number; even the right password is refused for 15 minutes.
- runFlow: subflows/log-out.yaml
- tapOn:
    id: login-phone
- inputText: '0770000005'
- pressKey: Enter
- repeat:
    times: 5
    commands:
      - tapOn:
          id: login-password
      - inputText: 'wrong1234'
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: login-error
          timeout: 20000
- assertVisible: '.*15 நிமிடங்களுக்குப் பின்.*'
- tapOn:
    id: login-password
- inputText: 'physics26'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: login-error
    timeout: 20000
- assertVisible: '.*15 நிமிடங்களுக்குப் பின்.*'
- assertNotVisible:
    id: home-screen
