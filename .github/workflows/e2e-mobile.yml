name: E2E (mobile)

# Builds a release APK for the emulator and runs every Maestro flow in apps/mobile/e2e.
#
# Runs on every PR so it can be a required check. The emulator job (~25 minutes) starts only
# when the app, shared contracts, database migrations or auth config, the lockfile or this
# workflow changed; otherwise it is skipped, and GitHub counts a skipped required check as
# passed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (e.g. first push): run the tests to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
            | grep -qE '^(apps/mobile/|packages/shared/|supabase/migrations/|supabase/functions/|supabase/config\.toml$|pnpm-lock\.yaml$|\.npmrc$|\.github/workflows/e2e-mobile\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Maestro on Android emulator
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # A real local Supabase (database, auth, API) so flows test the actual server rules.
      # Test phone numbers and their fixed OTP come from supabase/config.toml.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      # A fresh random pepper per run for the login Edge Functions (ADR-0009). Not a
      # production value; production sets its own with `supabase secrets set`.
      - name: Generate a test password pepper
        run: |
          pepper=$(openssl rand -hex 32)
          echo "::add-mask::$pepper"
          echo "PASSWORD_PEPPER=$pepper" >> "$GITHUB_ENV"
      - name: Start local Supabase
        env:
          # Placeholder for the unused local Twilio entry in config.toml (not a credential).
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local-placeholder
        # Retries because a shared GitHub runner occasionally has a Supabase port (5432x)
        # briefly taken; each failed try logs what holds the port, then cleans up.
        run: |
          for attempt in 1 2 3; do
            if supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt $attempt of 3). Listening on Supabase ports:"
            sudo ss -ltnp | grep -E ':543[0-9][0-9]\b' || true
            supabase stop --no-backup || true
            sleep 15
          done
          exit 1
      - name: Point the test build at it
        run: |
          eval "$(supabase status -o env 2>/dev/null)"
          KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          test -n "$KEY" || { echo "No anon key from supabase status"; exit 1; }
          # 10.0.2.2 is the host machine as seen from the Android emulator.
          echo "EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          echo "E2E_ALLOW_CLEARTEXT=1" >> "$GITHUB_ENV"

      # Fails fast (before the ~15 minute Android build) if the OTP sign-up path is broken.
      # Uses the second test number so the Maestro flow's number is untouched.
      - name: Smoke-test OTP sign-up against the local Supabase
        run: |
          api=http://127.0.0.1:54321/auth/v1
          send=$(curl -s -w '\n%{http_code}' -X POST "$api/otp" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"phone":"+94770000002","create_user":true}')
          echo "send OTP -> $send"
          verify=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/verify" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"phone":"+94770000002","token":"123456","type":"sms"}')
          echo "verify OTP -> $verify"
          if [ "$(echo "$send" | tail -1)" != "200" ] || [ "$verify" != "200" ]; then
            echo "::group::auth log"; docker logs supabase_auth_fizzix --tail 80 2>&1; echo "::endgroup::"
            exit 1
          fi

      # Same idea for ST-54: set a password through the Edge Function, then log in with it.
      # The first call also waits for the edge runtime to load the functions.
      - name: Smoke-test password login against the local Supabase
        run: |
          api=http://127.0.0.1:54321
          token=$(curl -s -X POST "$api/auth/v1/verify" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"phone":"+94770000002","token":"123456","type":"sms"}' | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            # The OTP was used by the previous step; ask for a new one.
            curl -s -o /dev/null -X POST "$api/auth/v1/otp" -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' -d '{"phone":"+94770000002","create_user":true}'
            token=$(curl -s -X POST "$api/auth/v1/verify" \
              -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
              -d '{"phone":"+94770000002","token":"123456","type":"sms"}' | jq -r .access_token)
          fi
          set_pw=000
          for i in $(seq 1 30); do
            set_pw=$(curl -s -o /tmp/set.json -w '%{http_code}' -X POST "$api/functions/v1/set-password" \
              -H "authorization: Bearer $token" -H 'Content-Type: application/json' \
              -d '{"password":"smoke1234"}')
            [ "$set_pw" = "200" ] && break
            sleep 5
          done
          good=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/functions/v1/login" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"phone":"0770000002","password":"smoke1234"}')
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/functions/v1/login" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"phone":"0770000002","password":"wrong1234"}')
          direct=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/auth/v1/token?grant_type=password" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"phone":"94770000002","password":"smoke1234"}')
          # Setting the password ends the OTP session; the session it returns must work.
          kept=$(curl -s -o /dev/null -w '%{http_code}' "$api/auth/v1/user" -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $(jq -r .access_token /tmp/set.json)")
          echo "set-password -> $set_pw, its session -> $kept, login -> $good, wrong -> $bad, direct Auth -> $direct"
          if [ "$set_pw" != "200" ] || [ "$kept" != "200" ] || [ "$good" != "200" ] || [ "$bad" != "401" ] || [ "$direct" = "200" ]; then
            echo "::group::edge runtime log"; docker logs supabase_edge_runtime_fizzix --tail 80 2>&1; echo "::endgroup::"
            exit 1
          fi

      # ST-55: finish the smoke account, then reset its password through both Edge Functions
      # and log in with the new one. Prints the server logs if any step fails.
      - name: Smoke-test password reset against the local Supabase
        run: |
          api=http://127.0.0.1:54321
          key="$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          dump() {
            echo "::group::edge runtime log"; docker logs supabase_edge_runtime_fizzix --tail 120 2>&1; echo "::endgroup::"
            echo "::group::auth log"; docker logs supabase_auth_fizzix --tail 60 2>&1; echo "::endgroup::"
          }
          otp_token() {
            curl -s -X POST "$api/auth/v1/verify" -H "apikey: $key" -H 'Content-Type: application/json' \
              -d '{"phone":"+94770000002","token":"123456","type":"sms"}' | jq -r .access_token
          }
          login() {
            curl -s -o /dev/null -w '%{http_code}' -X POST "$api/functions/v1/login" -H "apikey: $key" \
              -H 'Content-Type: application/json' -d "{\"phone\":\"0770000002\",\"password\":\"$1\"}"
          }
          # Finish the account the password smoke test started (details, consent, complete).
          token=$(curl -s -X POST "$api/functions/v1/login" -H "apikey: $key" -H 'Content-Type: application/json' \
            -d '{"phone":"0770000002","password":"smoke1234"}' | jq -r .access_token)
          version=$(curl -s "$api/rest/v1/app_config?key=eq.privacy_notice&select=value" -H "apikey: $key" | jq -r '.[0].value.version')
          rpc() { curl -s -o /tmp/rpc.json -w '%{http_code}' -X POST "$api/rest/v1/rpc/$1" -H "apikey: $key" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$2"; }
          a=$(rpc save_account_details '{"p_display_name":"Smoke","p_username":"smoke_ci","p_exam_year":2027,"p_stream":"bio"}')
          b=$(rpc record_consent "{\"p_notice_version\":\"$version\",\"p_age_band\":\"16_plus\"}")
          c=$(rpc complete_account '{}')
          echo "account: details $a, consent $b, complete $c ($(cat /tmp/rpc.json))"
          sleep 46 # Auth allows one OTP per number every 45 seconds
          req=$(curl -s -o /tmp/req.json -w '%{http_code}' -X POST "$api/functions/v1/reset-request" \
            -H "apikey: $key" -H 'Content-Type: application/json' -d '{"phone":"0770000002"}')
          otp=$(otp_token)
          save=$(curl -s -o /tmp/save.json -w '%{http_code}' -X POST "$api/functions/v1/reset-password" \
            -H "apikey: $key" -H "Authorization: Bearer $otp" -H 'Content-Type: application/json' \
            -d '{"password":"reset1234"}')
          # AC3: the session from before the reset no longer works.
          before=$(curl -s -o /dev/null -w '%{http_code}' "$api/auth/v1/user" -H "apikey: $key" -H "Authorization: Bearer $token")
          old=$(login smoke1234); new=$(login reset1234)
          echo "reset-request -> $req ($(cat /tmp/req.json)), reset-password -> $save ($(cat /tmp/save.json)), earlier session -> $before, old -> $old, new -> $new"
          if [ "$c" != "204" ] && [ "$c" != "200" ]; then dump; exit 1; fi
          if [ "$req" != "200" ] || [ "$save" != "200" ] || [ "$before" = "200" ] || [ "$old" != "401" ] || [ "$new" != "200" ]; then dump; exit 1; fi

      # ST-06: two logins for the same account; only the newest session stays active.
      - name: Smoke-test one active device against the local Supabase
        run: |
          api=http://127.0.0.1:54321
          key="$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          login() {
            curl -s -X POST "$api/functions/v1/login" -H "apikey: $key" -H 'Content-Type: application/json' \
              -d '{"phone":"0770000002","password":"reset1234"}' | jq -r .access_token
          }
          status() {
            curl -s -X POST "$api/rest/v1/rpc/session_status" -H "apikey: $key" \
              -H "Authorization: Bearer $1" -H 'Content-Type: application/json' -d '{}'
          }
          a=$(login); b=$(login)
          sa=$(status "$a"); sb=$(status "$b")
          echo "first phone active: $sa, second phone active: $sb"
          if [ "$sa" != "false" ] || [ "$sb" != "true" ]; then
            echo "::group::auth log"; docker logs supabase_auth_fizzix --tail 60 2>&1; echo "::endgroup::"
            exit 1
          fi

      # ST-56: change the password with the current one; this phone gets a working session.
      - name: Smoke-test change password against the local Supabase
        run: |
          api=http://127.0.0.1:54321
          key="$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          login() {
            curl -s -o /tmp/login.json -w '%{http_code}' -X POST "$api/functions/v1/login" -H "apikey: $key" \
              -H 'Content-Type: application/json' -d "{\"phone\":\"0770000002\",\"password\":\"$1\"}"
          }
          login reset1234 >/dev/null; token=$(jq -r .access_token /tmp/login.json)
          change=$(curl -s -o /tmp/change.json -w '%{http_code}' -X POST "$api/functions/v1/change-password" \
            -H "apikey: $key" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"current":"reset1234","password":"change1234"}')
          fresh=$(jq -r .access_token /tmp/change.json)
          active=$(curl -s -X POST "$api/rest/v1/rpc/session_status" -H "apikey: $key" \
            -H "Authorization: Bearer $fresh" -H 'Content-Type: application/json' -d '{}')
          old=$(login reset1234); new=$(login change1234)
          echo "change-password -> $change, new session active -> $active, old -> $old, new -> $new"
          if [ "$change" != "200" ] || [ "$active" != "true" ] || [ "$old" != "401" ] || [ "$new" != "200" ]; then
            echo "::group::edge runtime log"; docker logs supabase_edge_runtime_fizzix --tail 60 2>&1; echo "::endgroup::"
            exit 1
          fi

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # More CPU and memory: the default 2 cores leave the system UI unresponsive right
          # after boot ("Pixel Launcher isn't responding"), and that dialog hid our app.
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            bash apps/mobile/e2e/wait-for-idle.sh
            bash apps/mobile/e2e/run.sh

      - name: Upload Maestro report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: maestro-results
          if-no-files-found: ignore
          retention-days: 14
