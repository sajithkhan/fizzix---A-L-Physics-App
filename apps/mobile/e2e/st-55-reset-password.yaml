# ST-55 · Reset a forgotten password — end to end against a local Supabase and the
# reset-request / reset-password Edge Functions. Creates an account for test number
# 0770000008 (OTP 123456, see supabase/config.toml), logs out, resets the password and logs in
# with the new one. Keyboard: tap the title (on the phone field Enter would also send) or
# press Enter (hideKeyboard presses Back, which closes the app).
appId: lk.fizzix.app
name: ST-55 Reset a forgotten password
tags:
  - ST-55
---
- runFlow:
    file: subflows/sign-up.yaml
    env:
      PHONE: '0770000008'
      NAME: 'Priya Nathan'
      USERNAME: 'priya_e2e'
- runFlow: subflows/log-out.yaml

# AC1: login links to the reset screen.
- tapOn:
    id: login-forgot
- extendedWaitUntil:
    visible:
      id: reset-screen
    timeout: 20000
- assertVisible: 'Password மீட்டமை'

# AC2: a number without an account gets no OTP and is told to register.
- tapOn:
    id: reset-phone
- inputText: '0770000009'
- tapOn: 'Password மீட்டமை'
- tapOn:
    id: reset-send-otp
- extendedWaitUntil:
    visible:
      id: reset-error
    timeout: 20000
- assertVisible: '.*இந்த நம்பரில் கணக்கு இல்லை.*'
- assertNotVisible:
    id: reset-otp

# The registered number gets the OTP; resend waits 45 seconds.
- tapOn:
    id: reset-phone
- eraseText: 12
- inputText: '0770000008'
- tapOn: 'Password மீட்டமை'
- tapOn:
    id: reset-send-otp
# (the OTP field takes focus and the keyboard covers the save button, so wait for the boxes)
- extendedWaitUntil:
    visible:
      id: reset-otp-boxes
    timeout: 20000
- assertVisible: '.*மீண்டும் அனுப்ப 0:4.*'
- inputText: '123456'
- pressKey: Enter

# New password twice, then save.
- scrollUntilVisible:
    element:
      id: reset-password
- tapOn:
    id: reset-password
- inputText: 'newphys27'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: reset-confirm
- tapOn:
    id: reset-confirm
- inputText: 'newphys27'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: reset-save
- tapOn:
    id: reset-save

# AC3: back on login with a note; the old password no longer works, the new one does.
- extendedWaitUntil:
    visible:
      id: login-reset-done
    timeout: 30000
- tapOn:
    id: login-phone
- inputText: '0770000008'
- pressKey: Enter
- tapOn:
    id: login-password
- inputText: 'physics26'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: login-error
    timeout: 20000
- tapOn:
    id: login-password
- inputText: 'newphys27'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000
