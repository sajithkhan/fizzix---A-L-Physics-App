name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - run: deno check _shared/*.ts
      - run: deno test --permit-no-files

  database:
    name: Database (migrations, RLS, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1 # pinned: "latest" calls the GitHub API and can hit rate limits
      - name: Start local database
        env:
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local-placeholder
        # Same retry as the E2E job: a shared runner can briefly hold port 54322.
        run: |
          for attempt in 1 2 3; do
            if supabase db start; then exit 0; fi
            echo "::warning::supabase db start failed (attempt $attempt of 3). Listening on Supabase ports:"
            sudo ss -ltnp | grep -E ':543[0-9][0-9]\b' || true
            supabase stop --no-backup || true
            sleep 15
          done
          exit 1
      - name: Lint SQL (security definer, search_path, etc.)
        run: supabase db lint --level error --fail-on error
      - name: pgTAP tests
        run: supabase test db

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
