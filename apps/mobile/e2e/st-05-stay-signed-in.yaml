# ST-05 · Stay signed in — end to end against a local Supabase. Creates an account for test
# number 0770000006 (OTP 123456, see supabase/config.toml), restarts the app (straight to
# home), logs out, and logs back in with the password. Keyboard: Enter closes it
# (hideKeyboard presses Back, which closes the app).
appId: lk.fizzix.app
name: ST-05 Stay signed in
tags:
  - ST-05
---
# Set up: a finished account (ST-02, ST-04, ST-58).
- runFlow:
    file: subflows/sign-up.yaml
    env:
      PHONE: '0770000006'
      NAME: 'Thara Silva'
      USERNAME: 'thara_e2e'

# AC1: close and reopen, twice: straight to home each time.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
- assertNotVisible:
    id: login-screen

# AC2: after logout the app opens on login.
- runFlow: subflows/log-out.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 30000

# "No OTP" for a registered number is the SMS hook's job (pgTAP: 60_sms_hook, 70_account).
# Supabase skips the hook for the local test numbers, so it cannot be shown here.

# Number and password sign in again, and the session survives a restart.
- tapOn:
    id: login-phone
- inputText: '0770000006'
- pressKey: Enter
- tapOn:
    id: login-password
- inputText: 'physics26'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
