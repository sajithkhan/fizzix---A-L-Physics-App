name: Release to staging

# Manual, end-of-day release (docs/staging-release.md). Takes whatever is on main and:
#   1. applies migrations (and the test-number seed) to the staging Supabase project
#   2. pushes auth settings from supabase/config.toml (hooks, test OTP numbers)
#   3. sets Edge Function secrets and deploys every Edge Function
#   4. builds a signed APK pointing at staging and publishes it as a GitHub Release
# A failed step stops the run, so a phone never gets an app newer than the server.
# Staging only: the production project gets its own workflow before launch (no test numbers).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-staging
  cancel-in-progress: false

jobs:
  release:
    name: Deploy staging and publish APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      # Placeholder for the unused Twilio entry in config.toml (not a credential).
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local-placeholder
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check the staging secrets are set
        env:
          S1: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          S2: ${{ secrets.STAGING_PROJECT_REF }}
          S3: ${{ secrets.STAGING_DB_PASSWORD }}
          S4: ${{ secrets.STAGING_PASSWORD_PEPPER }}
          S5: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
          S6: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$S1" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$S2" ] || missing="$missing STAGING_PROJECT_REF"
          [ -n "$S3" ] || missing="$missing STAGING_DB_PASSWORD"
          [ -n "$S4" ] || missing="$missing STAGING_PASSWORD_PEPPER"
          [ -n "$S5" ] || missing="$missing STAGING_KEYSTORE_BASE64"
          [ -n "$S6" ] || missing="$missing STAGING_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see docs/staging-release.md)"; exit 1
          fi
          if [ "${#S4}" -lt 32 ]; then
            echo "::error::STAGING_PASSWORD_PEPPER must be at least 32 characters"; exit 1
          fi

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Link the staging project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Push auth settings (hooks, test numbers)
        run: supabase config push --project-ref "$PROJECT_REF" --yes

      - name: Check auth settings took effect
        run: |
          cfg=$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "$cfg" | jq -e '
            .external_phone_enabled == true and
            .hook_send_sms_enabled == true and
            .hook_custom_access_token_enabled == true and
            ((.sms_test_otp // "") | contains("94770000001"))' >/dev/null || {
            echo "::error::Staging auth settings are not as expected:"
            echo "$cfg" | jq '{external_phone_enabled, hook_send_sms_enabled, hook_custom_access_token_enabled, sms_test_otp}'
            exit 1
          }

      - name: Set Edge Function secrets
        env:
          PEPPER: ${{ secrets.STAGING_PASSWORD_PEPPER }}
        run: supabase secrets set --project-ref "$PROJECT_REF" "PASSWORD_PEPPER=$PEPPER"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Staging URL and anon key for the app
        run: |
          key=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          test -n "$key" && [ "$key" != "null" ] || { echo "::error::No anon key"; exit 1; }
          echo "EXPO_PUBLIC_SUPABASE_URL=https://$PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"

      # Fails before the long Android build if sign-up or the Edge Functions are broken.
      - name: Smoke test staging
        run: |
          api="$EXPO_PUBLIC_SUPABASE_URL"
          key="$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          otp=$(curl -s -o /tmp/otp.json -w '%{http_code}' -X POST "$api/auth/v1/otp" \
            -H "apikey: $key" -H 'Content-Type: application/json' -d '{"phone":"94770000012"}')
          login=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST "$api/functions/v1/login" \
            -H "apikey: $key" -H 'Content-Type: application/json' \
            -d '{"phone":"+94770000099","password":"not-a-real-password"}')
          echo "test-number OTP -> $otp, login with an unknown number -> $login"
          if [ "$otp" != "200" ] || [ "$login" != "401" ]; then
            echo "otp: $(cat /tmp/otp.json)"; echo "login: $(cat /tmp/login.json)"; exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
        run: |
          path="$RUNNER_TEMP/staging.keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$path"
          echo "RELEASE_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"

      - name: Generate native Android project (staging)
        working-directory: apps/mobile
        env:
          APP_VARIANT: staging
          APP_VERSION_CODE: ${{ github.run_number }}
          RELEASE_SIGNING: '1'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build signed APK for phones (arm64 and older 32-bit)
        working-directory: apps/mobile/android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: fizzix-staging
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Check the APK is signed with the staging key
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is signed with the debug key"; exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/fizzix-staging-$VERSION_CODE.apk"
          rm -f "$RELEASE_KEYSTORE_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="staging-$VERSION_CODE"
          # A re-run of the same run replaces its own release.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$RUNNER_TEMP/fizzix-staging-$VERSION_CODE.apk" \
            --target "$GITHUB_SHA" \
            --title "Staging $VERSION_CODE · $(TZ=Asia/Colombo date '+%Y-%m-%d %H:%M')" \
            --generate-notes --latest
          {
            echo "### Staging $VERSION_CODE released"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- APK: fizzix-staging-$VERSION_CODE.apk"
            echo "- Finished: $(TZ=Asia/Colombo date '+%-I:%M %p') Sri Lanka time"
          } >> "$GITHUB_STEP_SUMMARY"
