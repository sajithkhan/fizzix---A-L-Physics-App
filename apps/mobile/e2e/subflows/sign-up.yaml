# Shared setup, not a test on its own (Maestro runs only the top-level flows in e2e/).
# Fresh app → language → sign up ${PHONE} (a test number from supabase/config.toml, OTP
# 123456) → account details, 16+, privacy accepted → home.
appId: lk.fizzix.app
---
# Wipe the app the reliable way: stop it, clear its data, then start it. Starting right
# after a wipe can take over a minute on the CI emulator, hence the longer wait.
- stopApp
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: language-screen
    timeout: 120000
- tapOn:
    id: language-continue
- extendedWaitUntil:
    visible:
      id: register-screen
    timeout: 20000
- tapOn:
    id: register-phone
- inputText: ${PHONE}
- tapOn: 'புதிய கணக்கு'
- tapOn:
    id: register-send-otp
- extendedWaitUntil:
    visible:
      id: register-verify
    timeout: 20000
- inputText: '123456'
- tapOn: 'புதிய கணக்கு'
- tapOn:
    id: register-verify
- extendedWaitUntil:
    visible:
      id: account-screen
    timeout: 20000
- tapOn:
    id: account-name
- inputText: ${NAME}
- pressKey: Enter
- tapOn:
    id: account-username
- inputText: ${USERNAME}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: account-password
- tapOn:
    id: account-password
- inputText: 'physics26'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: account-confirm
- tapOn:
    id: account-confirm
- inputText: 'physics26'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: account-year-2027
- tapOn:
    id: account-year-2027
- tapOn:
    id: account-stream-bio
- scrollUntilVisible:
    element:
      id: account-age-16_plus
- tapOn:
    id: account-age-16_plus
- scrollUntilVisible:
    element:
      id: account-privacy-accept
- tapOn:
    id: account-privacy-accept
- scrollUntilVisible:
    element:
      id: account-submit
- tapOn:
    id: account-submit
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000
